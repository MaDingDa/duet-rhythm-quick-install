name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Build executable
        shell: pwsh
        run: |
          ./windows/build.ps1
          $exe = Get-Item -LiteralPath ./dist/DuetRhythmPlus-Windows-x64.exe
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -LiteralPath ./dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DuetRhythmPlus-Windows-x64
          path: |
            dist/DuetRhythmPlus-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
